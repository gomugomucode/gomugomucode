name: GitHub-Profile-3D-Contrib

on:
  push:
    branches:
      - main   # Automatically triggers when you update code on main
  workflow_dispatch: # Allows manual trigger via the Actions tab
  schedule:
    - cron: "0 */12 * * *"  # Runs automatically every 12 hours

# Explicitly grant the GITHUB_TOKEN write access to push changes
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3
      
      - uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A .
          git commit -m "Generated clean 3D Contribution Graph" || echo "No changes to commit"
          
          # Pull changes to avoid conflicts, then push
          git pull --rebase --autostash
          git push
